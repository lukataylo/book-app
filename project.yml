name: BookApp
options:
  bundleIdPrefix: com.lukataylor
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  defaultConfig: Debug
  groupSortPosition: top
  developmentLanguage: en

configFiles:
  Debug: BookApp/Supporting/Default.xcconfig
  Release: BookApp/Supporting/Default.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.lukataylor.bookapp
    INFOPLIST_FILE: BookApp/Supporting/Info.plist
    CODE_SIGN_ENTITLEMENTS: BookApp/Supporting/BookApp.entitlements
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # DEVELOPMENT_TEAM is supplied by Default.xcconfig, which optionally
    # includes Local.xcconfig (gitignored). See Local.xcconfig.example.

packages:
  # Only ZIPFoundation is used, to unzip EPUB containers. This is
  # Readium's fork of it, depended on directly — the full swift-toolkit
  # used to be linked for this one module and dragged in GCDWebServer,
  # CryptoSwift, SwiftSoup, DifferenceKit, SQLite.swift, Zip and Fuzi
  # with it. Nothing in the app ever imported ReadiumShared, Streamer or
  # Navigator; see EPUBParser, which says so itself.
  ReadiumZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    from: "3.0.0"

targets:
  BookApp:
    type: application
    # macOS is reachable via Mac Catalyst (designedForIPad). Native macOS
    # currently fails to resolve Readium's SwiftSoup transitive dep — see
    # README → "macOS support".
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: BookApp
        excludes:
          - "Supporting/Info.plist"
          - "Supporting/BookApp.entitlements"
          - "Supporting/PrivacyInfo.xcprivacy"   # added below as explicit resource
          - "Resources/SummaryPacks"  # added below as folder reference
          - "Resources/FullTexts"     # added below as folder reference
      # Privacy manifest — required by App Review since 2024. Apple wants
      # this at the bundle root, so we add it as an explicit resource
      # rather than letting it drop into a Supporting/ subfolder.
      - path: BookApp/Supporting/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Folder-reference for the summary catalog ("The Big Ideas in …")
      # JSON packs — Read/Remember/Act seed content. SummaryPackLoader
      # walks this directory at launch.
      - path: BookApp/Resources/SummaryPacks
        type: folder
        buildPhase: resources
        optional: true
      # The public-domain source text behind each summary, seeded as the
      # book's `.original` variant. Folder-reference so `Bundle.main`
      # resolves `FullTexts/<slug>.txt` at runtime.
      - path: BookApp/Resources/FullTexts
        type: folder
        buildPhase: resources
        optional: true
      # Snapshot model is shared with the widget extension (which needs
      # the same file in its target).
      - path: BookAppWidget/WidgetSnapshot.swift
    dependencies:
      - package: ReadiumZIPFoundation
        product: ReadiumZIPFoundation
      - target: BookAppWidget
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BookAppWidget:
    type: app-extension
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: BookAppWidget
        excludes:
          - "Info.plist"
          - "BookAppWidget.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukataylor.bookapp.widget
        INFOPLIST_FILE: BookAppWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BookAppWidget/BookAppWidget.entitlements
        SKIP_INSTALL: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"

  BookAppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, iPadOS]
    sources:
      - BookAppTests
    dependencies:
      - target: BookApp
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BookApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BookApp

  BookAppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, iPadOS]
    sources:
      - BookAppUITests
    dependencies:
      - target: BookApp
    settings:
      base:
        TEST_TARGET_NAME: BookApp
